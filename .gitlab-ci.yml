# =============================================================================
# GitLab CI/CD Pipeline for Timima Backend API (Python/FastAPI)
# =============================================================================

cache:
  paths:
    - .venv/

stages:
  - test
  - sonarqube
  - deploy

# =============================================================================
# Test Stage
# =============================================================================
test-build:
  stage: test
  image: python:3.13-slim
  before_script:
    - echo "Installing system dependencies"
    - apt-get update && apt-get install -y --no-install-recommends gcc g++ libpq-dev
    - echo "Installing Python dependencies"
    - pip install --no-cache-dir uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -e ".[dev]"
  script:
    - echo "Check format and lint"
    - ruff check .
    - ruff format --check .
    - echo "Type checking"
    - mypy src/
    - echo "Running tests"
    - pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      cobertura: coverage.xml
  only:
    - merge_requests
  tags:
    - jmu-timima01-be

# =============================================================================
# SonarQube Stage
# =============================================================================
sonarqube-check:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:11.1.1.1661_6.2.1
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  tags:
    - jmu-timima01-be
  only:
    - merge_requests

# =============================================================================
# Deploy to Development
# =============================================================================
deploying-dev:
  stage: deploy
  image: python:3.13-slim
  before_script:
    - echo "Installing SSH client"
    - which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo "$DEV_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/private_key
    - chmod 700 ~/.ssh/private_key
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/private_key
    - ssh-keyscan -H $DEV_SSH_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to server Development"
    - ssh -o StrictHostKeyChecking=no $DEV_SSH_USER@$DEV_SSH_HOST "bash /var/www/html/timima01/backend/deploy-dev.sh"
    - echo "Deployed successfully"
  only:
    - develop
  tags:
    - jmu-timima01-be
