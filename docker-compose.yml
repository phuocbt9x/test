# =============================================================================
# Docker Compose - Timima FastAPI Project (Production/CI-CD)
# =============================================================================

networks:
  app_network:
    name: ${APP_NAME}_network
    driver: bridge

services:
  # =============================================================================
  # FastAPI Application Service (Python)
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
    image: timima_app:${APP_VERSION:-latest}
    container_name: ${APP_NAME}_app
    restart: unless-stopped
    env_file:
      - .env
      - .env.docker
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
    - ./${APP_NAME}/logs:/app/logs
    - ./${APP_NAME}/uploads:/app/uploads
    - ./${APP_NAME}/static:/app/static
    - ./public:/app/public
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # =============================================================================
  # PostgreSQL Database Service
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${APP_NAME}_postgres
    restart: unless-stopped
    env_file:
      - .env
      - .env.docker
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: ${APP_TIMEZONE:-Asia/Tokyo}
      PGTZ: ${APP_TIMEZONE:-Asia/Tokyo}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./${APP_NAME}/postgres_data:/var/lib/postgresql/data
      - ./${APP_NAME}/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./${APP_NAME}/backups:/backups
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Redis Cache Service
  # =============================================================================
  redis:
    image: redis:7.4-alpine
    container_name: ${APP_NAME}_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
      - .env.docker
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: ${APP_TIMEZONE:-Asia/Tokyo}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./${APP_NAME}/redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: |
        sh -c '
        if [ -n "$REDIS_PASSWORD" ]; then
          redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep PONG
        else
          redis-cli ping | grep PONG
        fi
        '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # MailHog (SMTP dev/test)
  # =============================================================================
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ${APP_NAME}_mailhog
    restart: unless-stopped
    env_file:
      - .env
      - .env.docker
    ports:
      - ${MAIL_PORT:-1025}:1025
      - ${MAILHOG_HTTP_PORT:-8025}:8025
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
